[workspace]
resolver = "2"
members = ["crates/delta-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Abderrahmane Chahdane <a.chahdane@gmail.com>"]
repository = "https://github.com/Chahdane/tauri-updater"

[workspace.dependencies]
blake3 = "1"
thiserror = "2"
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1

[workspace]
resolver = "2"
members = [
  "crates/delta-core",
  "crates/delta-release",
  "crates/fixtures",
  "crates/plugin",
  "examples/desktop-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Abderrahmane Chahdane <a.chahdane@gmail.com>"]
repository = "https://github.com/Chahdane/tauri-updater"
homepage = "https://github.com/Chahdane/tauri-updater"

[workspace.dependencies]
blake3 = "1"
thiserror = "2"
zstd = "0.14"
# Held at 0.22: tauri-plugin-updater 2.10/2.11 decodes signatures with base64
# 0.22, and the plugin's own check reproduces Tauri's verifier verbatim
# (DECISIONS #6, #10). Move only together with the upstream it mirrors.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
# Held at 0.7: 0.9 changes how key boxes are unlocked (an unencrypted box is
# refused; encrypted empty-password keys behave differently), which is the
# release signing path and DECISIONS #16. Needs its own design pass.
minisign = "0.7"
minisign-verify = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
log = "0.4"
# Release-time URL policy. Already in the workspace graph via tauri/reqwest,
# so requiring it here adds nothing new to the lock.
url = "2"

# Published to crates.io. A path dependency needs a `version` to survive
# publication: cargo strips the path and a consumer resolves the registry
# version, so without one `cargo package` refuses the dependent crates
# outright. See docs/RELEASING.md.
tauri-updater-delta-core = { path = "crates/delta-core", version = "0.2.0" }
tauri-updater-delta-release = { path = "crates/delta-release", version = "0.2.0" }
# Never published. Left without a version deliberately: cargo strips a
# version-less dev-dependency when packaging, which is exactly right for a
# fixtures crate that will not exist on crates.io.
tauri-updater-delta-fixtures = { path = "crates/fixtures" }

[profile.release]
lto = true
codegen-units = 1

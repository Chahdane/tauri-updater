[workspace]
resolver = "2"
members = [
  "crates/delta-core",
  "crates/delta-release",
  "crates/fixtures",
  "crates/plugin",
  "examples/desktop-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Abderrahmane Chahdane <a.chahdane@gmail.com>"]
repository = "https://github.com/Chahdane/tauri-updater"
homepage = "https://github.com/Chahdane/tauri-updater"

[workspace.dependencies]
blake3 = "1"
thiserror = "2"
zstd = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
minisign = "0.7"
minisign-verify = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
log = "0.4"

# Published to crates.io: `version` is required for a path dependency to
# survive publication, and is what a consumer actually resolves.
tauri-updater-delta-core = { path = "crates/delta-core", version = "0.1.0" }
tauri-updater-delta-release = { path = "crates/delta-release", version = "0.1.0" }
# Never published. Left without a version on purpose: cargo strips a
# version-less dev-dependency when packaging, which is exactly right for a
# fixtures crate that will not exist on crates.io.
tauri-updater-delta-fixtures = { path = "crates/fixtures" }

[profile.release]
lto = true
codegen-units = 1

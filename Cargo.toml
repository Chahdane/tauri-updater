[workspace]
resolver = "2"
members = ["crates/delta-core", "crates/delta-release", "crates/fixtures", "crates/plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Abderrahmane Chahdane <a.chahdane@gmail.com>"]
repository = "https://github.com/Chahdane/tauri-updater"

[workspace.dependencies]
blake3 = "1"
thiserror = "2"
zstd = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign = "0.7"
minisign-verify = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# Internal
tauri-updater-delta-core = { path = "crates/delta-core" }
tauri-updater-delta-fixtures = { path = "crates/fixtures" }
tauri-updater-delta-release = { path = "crates/delta-release" }

[profile.release]
lto = true
codegen-units = 1

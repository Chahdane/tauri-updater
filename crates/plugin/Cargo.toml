[package]
name = "tauri-plugin-updater-delta"
description = "Binary delta updates for Tauri v2 — wraps tauri-plugin-updater to shrink the download."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tauri = "2"
tauri-plugin-updater = "2"
tauri-updater-delta-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror.workspace = true

[dev-dependencies]
tauri-updater-delta-fixtures.workspace = true
tauri-updater-delta-release.workspace = true
minisign.workspace = true
base64.workspace = true
tempfile.workspace = true

[package]
name = "tauri-plugin-updater-delta"
description = "Binary delta updates for Tauri v2 — wraps tauri-plugin-updater to shrink the download."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tauri", "updater", "delta", "auto-update", "macos"]
categories = ["development-tools", "gui"]

[dependencies]
tauri = "2"
# Narrowed deliberately. Every security-relevant claim this plugin makes was
# verified by reading 2.10.1's source: that `Update::install` does not verify,
# that `verify_signature` is called from exactly one place, that `raw_json`
# retains the fetched document, that `get_urls` searches installer-specific
# target keys first, and what `validate_endpoints` does about http. A caret
# range would let any of those change under us while CI stayed green.
# See docs/DECISIONS.md #21.
tauri-plugin-updater = ">=2.10.1, <2.11.0"
tauri-updater-delta-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror.workspace = true
log.workspace = true

[features]
default = []
# Internal flow and localhost transport controls used by this repository's
# integration tests and real-app harness. Normal applications must not enable
# this feature.
test-support = []

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
semver.workspace = true
tauri-updater-delta-fixtures.workspace = true
tauri-updater-delta-release.workspace = true
minisign.workspace = true
base64.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# Real .app.tar.gz fixtures, built the way tauri-bundler builds them.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
tar = "0.4"

[[test]]
name = "real_transport"
path = "tests/real_transport.rs"
required-features = ["test-support"]

[[test]]
name = "release_identity_flow"
path = "tests/release_identity_flow.rs"
required-features = ["test-support"]

[[test]]
name = "tar_delta_flow"
path = "tests/tar_delta_flow.rs"
required-features = ["test-support"]

[[test]]
name = "transaction_isolation"
path = "tests/transaction_isolation.rs"
required-features = ["test-support"]

[[test]]
name = "update_flow"
path = "tests/update_flow.rs"
required-features = ["test-support"]

[[test]]
name = "public_api"
path = "tests/public_api.rs"
required-features = ["test-support"]

# Deliberately NOT gated on test-support: this checks the published
# compatibility contract, which is a property of the default build.
[[test]]
name = "supported_versions"
path = "tests/supported_versions.rs"

[package]
name = "tauri-updater-delta-release"
description = "Release-time tooling: generate patches, sign installers and write the update manifest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tauri", "updater", "delta", "release", "codesign"]
categories = ["development-tools::build-utils", "command-line-utilities"]
# Shipped inside the package: cargo refuses a `readme` outside the crate
# root, and crates.io renders this file on the package page.
readme = "README.md"

[[bin]]
name = "delta-release"
path = "src/main.rs"

[dependencies]
tauri-updater-delta-core.workspace = true
base64.workspace = true
clap.workspace = true
minisign.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Runtime, not dev: the direct-patch self-check needs somewhere private to
# rebuild the artifact. Already a runtime dependency of delta-core, which this
# crate depends on, so nothing new enters the tree -- the same reasoning as
# docs/DECISIONS.md #18.
tempfile.workspace = true
# One URL parser for the generator and the checker, so the two cannot disagree
# about what a publishable URL is. See src/url_policy.rs.
url.workspace = true

[dev-dependencies]
tauri-updater-delta-fixtures.workspace = true
minisign-verify.workspace = true
# Building real .app.tar.gz fixtures the way tauri-bundler does, so the
# tar-layer tests exercise artifacts of the shape they will meet.
flate2 = { version = "=1.1.1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"

[package]
name = "tauri-updater-delta-core"
description = "Platform-agnostic binary delta engine: diff, apply and verify update artifacts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tauri", "updater", "delta", "binary-diff", "zstd"]
categories = ["development-tools", "compression"]
# Shipped inside the package: cargo refuses a `readme` outside the crate
# root, and crates.io renders this file on the package page.
readme = "README.md"

[dependencies]
base64.workspace = true
blake3.workspace = true
# zlib-rs backend, not flate2's miniz_oxide default: the two produce
# different DEFLATE output, and only zlib-rs reproduces the artifact Tauri's
# bundler published. See src/recompress.rs.
flate2 = { version = "=1.1.1", default-features = false, features = ["zlib-rs"] }
# Pinned exactly, with the two crates beneath it: the tar layer rebuilds the
# gzip stream tauri-bundler wrote, so it must run the same compressor build.
# These are the versions in tauri-cli 2.10.1's lockfile. flate2 1.1.9 with
# zlib-rs 0.6.7 produced different bytes for large incompressible files
# (DECISIONS #42). Change only together with the pinned tauri-cli.
libz-rs-sys = { version = "=0.5.0", default-features = false }
zlib-rs = { version = "=0.5.0", default-features = false }
minisign-verify.workspace = true
semver.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
# The writer tauri-bundler uses. Rebuilding a base tar from an installed .app
# repeats its exact call (DECISIONS #37); the recompression tests also use it
# as the reference writer. Already in every plugin build via
# tauri-plugin-updater, so this adds no new code to the tree.
tar = "=0.4.43"
thiserror.workspace = true
zstd.workspace = true

[dev-dependencies]
minisign.workspace = true
tauri-updater-delta-fixtures.workspace = true
tempfile.workspace = true

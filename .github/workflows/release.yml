name: Release the example application

# What an `app-v*` tag does, in full.
#
# ## Two tags, two tracks
#
# `v*`     -> .github/workflows/publish-crates.yml, which publishes the three
#             public crates at the workspace version.
# `app-v*` -> this workflow, which builds, signs and publishes the demonstration
#             application at *its* version.
#
# They were one namespace, and that was audit finding A-2: the workspace is
# 0.1.0 and the example app is 1.0.0, so tagging `v0.1.0` would have built a
# 1.0.0 application and published it under the signed release identity 0.1.0.
# Every cryptographic check would have passed on an artifact that lies about
# what it is. `delta-release --app-config` now refuses that outright, and the
# namespaces are separate so the mistake needs two errors rather than one.
#
#   tag → checkout → toolchain → prove the recompression recipe on this runner
#       → build the app → resolve the previous release → download its artifact
#       → generate + self-verify the patches → generate the manifest
#       → verify the manifest describes this release → upload
#
# ## The three states, all of them normal
#
# | | Predecessor | Publishes |
# | --- | --- | --- |
# | A | none | signed Full-only release |
# | B | exists, no usable artifact | signed Full-only release |
# | C | usable | Full + direct patch + tar-layer patch |
#
# Blocker **B5** was that A and B produced *nothing*. The generate step was
# gated on `has_previous`, so no predecessor meant no manifest and no signature,
# and the upload published a bare artifact no client could find or verify. The
# delta layer is the optional part of a release; the updater document is not.
# `delta-release` now takes an optional predecessor and the step is ungated.
#
# ## Manual prerequisites
#
# Checked before any work happens, because failing at the upload step after a
# twenty-minute build teaches nothing that failing in ten seconds does not.
#
# 1. `TAURI_SIGNING_PRIVATE_KEY` — repository secret. A release without a
#    signature is a release no client will install.
# 2. `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` — required if the key has one. A key
#    from `tauri signer generate --password ""` cannot be read by this tooling
#    at all; see docs/DECISIONS.md #16.
# 3. The tag is `app-vX.Y.Z` and names the application's own version. Both
#    `delta-release` and `release-check` are given `--app-config` and refuse to
#    publish when `tauri.conf.json`, the app crate's `Cargo.toml` and the tag do
#    not all agree.
#
# ## Scope, stated honestly
#
# Two platforms, two jobs, one manifest.
#
# | | Artifact | Delta layer |
# | --- | --- | --- |
# | macOS `aarch64` | `.app.tar.gz` | direct patch + tar layer |
# | Windows `x86_64` | NSIS `-setup.exe` | direct patch only |
#
# The tar layer needs a gzipped tarball whose exact compressed form this build
# can rebuild. An NSIS installer is neither, so a Windows release publishes an
# `opaque-v1` direct patch and nothing else. That is the honest shape of the
# thing, not a missing feature: `--require-tar-layer` is passed on macOS and
# must not be passed on Windows.
#
# The Windows job runs **after** the macOS one and extends the manifest it
# produced, because `delta-release` folds one platform into an existing
# document. If Windows fails, the release keeps a macOS-only manifest, which is
# a valid release rather than a broken one.
#
# The app is **not** Developer ID signed, notarized, or Authenticode signed. It
# is signed with a Tauri updater key, which is a different thing entirely — see
# docs/RELEASING.md. Nothing here claims an OS-level code-signing property on
# either platform.

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOS_PLATFORM: darwin-aarch64
  WINDOWS_PLATFORM: windows-x86_64
  # Pinned, not a caret range. The tar layer requires rebuilding the published
  # artifact byte-for-byte, and the recipe that does it was read out of
  # tauri-bundler 2.8.1 as shipped by this CLI version (docs/DECISIONS.md #26).
  # A caret range lets the runner bundle with a newer writer whose topology this
  # build cannot reproduce — which the round-trip would catch, but as a failed
  # release rather than as a decision anybody made.
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  # ---------------------------------------------------------------------------
  # Everything the real job does that does not need a key, a tag or an upload.
  # Runnable by hand, and the reason the release path is not first exercised on
  # the day it matters.
  # ---------------------------------------------------------------------------
  rehearsal:
    name: rehearsal (no upload)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Prove the binaries parse their own arguments
        # Debug profile on purpose: clap's duplicate-argument detection is a
        # debug assertion, so a release-only smoke test cannot see the class of
        # bug that once made every invocation of this tool panic, `--help`
        # included (docs/DECISIONS.md #20).
        run: cargo test --locked -p tauri-updater-delta-release --test cli

      - name: Rehearse all three release states
        # A: no predecessor. B: a predecessor with no usable artifact.
        # C: a usable predecessor. Each must produce a manifest that passes the
        # same publish gate the real job runs.
        run: |
          cargo test --release --locked -p tauri-updater-delta-release \
            --test release_states -- --nocapture

      - name: Run the whole release → client loop
        run: cargo test --release --locked -p tauri-updater-delta-release

      - name: Summary
        run: |
          echo "Rehearsal complete:"
          echo "  - both binaries build and parse arguments in debug"
          echo "  - release states A, B and C each produce a publishable manifest"
          echo "  - the release -> client loop passes against real artifacts"
          echo "  - nothing was signed with a real key and nothing was uploaded"

  # ---------------------------------------------------------------------------
  # The real thing.
  # ---------------------------------------------------------------------------
  release:
    name: macOS - build + sign + publish
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: macos-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      has_previous: ${{ steps.versions.outputs.has_previous }}
      previous_tag: ${{ steps.versions.outputs.previous_tag }}
      previous_version: ${{ steps.versions.outputs.previous_version }}
    steps:
      - name: Require the signing key before doing any work
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "::error::"
            echo "::error::Generate one with 'cargo tauri signer generate -w key' and add"
            echo "::error::the private key as a repository secret. Note that a key created"
            echo "::error::with an EMPTY password cannot be read back by this tooling at"
            echo "::error::all -- use a real password or no --password flag. See"
            echo "::error::docs/DECISIONS.md #16."
            echo "::error::"
            echo "::error::Failing now rather than after the build: a release without a"
            echo "::error::signature is a release no client will install."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the release tooling
        run: cargo build --release --locked -p tauri-updater-delta-release

      # Audit finding A-2, checked in seconds rather than after a twenty-minute
      # build. This is the same code the publish gate runs below, not a shell
      # re-implementation of it: a fast pre-check that can disagree with the gate
      # is worse than no pre-check at all.
      - name: Check the version contract before building anything
        run: |
          set -euo pipefail
          ./target/release/release-check \
            --tag "${GITHUB_REF_NAME}" \
            --app-config examples/desktop-app/tauri.conf.json \
            --only-version-contract

      # The strongest compatibility check available, and it runs before anything
      # is built. The fixture is an artifact `cargo tauri build` really produced,
      # retained byte-for-byte; this asserts that THIS runner, with THIS
      # toolchain and THESE pinned crates, still rebuilds it exactly and that the
      # signature issued over the original still accepts the rebuild.
      #
      # If it fails, the recompression recipe does not hold here, and a tar layer
      # published from this runner would be one no client could use. Prefer
      # explicit failure over optimistic compatibility (docs/DECISIONS.md #26).
      - name: Prove this runner can reproduce a published artifact
        run: |
          set -euo pipefail
          out=$(cargo test --locked -p tauri-updater-delta-core \
                  --test macos_recompression -- --nocapture)
          echo "$out"
          grep -q "4 passed; 0 failed; 0 ignored" <<< "$out" || {
            echo "::error::the recompression fixture did not fully run on this runner"
            exit 1
          }

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked

      - name: Record the toolchain this release was built with
        # Written into the job log and the step summary so a future
        # "why does this artifact not reproduce" has somewhere to start.
        run: |
          set -euo pipefail
          {
            echo "### Toolchain"
            echo ""
            echo '```'
            rustc --version
            cargo tauri --version
            echo "tar/flate2/zlib-rs: pinned by Cargo.lock (--locked everywhere)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve this and the previous release
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#app-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The most recent published release that is not this tag. Empty on the
          # first release, which is state A: normal, and no longer a state that
          # publishes nothing.
          previous_tag="$(gh release list --limit 20 --json tagName \
            --jq '.[].tagName' | grep '^app-v' | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"

          if [ -z "$previous_tag" ]; then
            echo "::notice::State A: no previous release. Publishing a complete"
            echo "::notice::signed full-download release with no delta layer."
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
            echo "previous_version=${previous_tag#app-v}" >> "$GITHUB_OUTPUT"
            echo "Previous release: $previous_tag"
          fi

      - name: Build this version
        # Plain `cargo tauri build`, native target, exactly as
        # examples/desktop-app/e2e/build-three-versions.sh runs it -- that script
        # is the only invocation whose output layout has actually been observed,
        # so the release path uses the same one rather than a plausible variant.
        #
        # Note what is NOT in the environment here: the signing key. Tauri signs
        # during the bundle step when it can, producing a signature with no
        # authenticated release identity. The signature this release publishes is
        # the one `delta-release` makes below, and there must not be a second
        # one for anybody to pick up by mistake.
        run: |
          set -euo pipefail
          (cd examples/desktop-app && cargo tauri build)
          mkdir -p dist
          shopt -s nullglob
          bundles=(target/release/bundle/macos/*.app.tar.gz)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .app.tar.gz, found ${#bundles[@]}."
            echo "::error::The bundle layout changed and every later step would be guessing."
            exit 1
          fi
          cp "${bundles[0]}" "dist/$(basename "${bundles[0]}")"
          if [ -e "${bundles[0]}.sig" ]; then
            echo "::error::the bundler produced a signature of its own."
            echo "::error::That signature carries no authenticated release identity, and"
            echo "::error::publishing it would make every client refuse the delta paths."
            echo "::error::The signing key must not be in scope during the build step."
            exit 1
          fi
          echo "Built $(basename "${bundles[0]}")"

      - name: Download the previous release's artifact
        if: steps.versions.outputs.has_previous == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          # State B: a previous release with no artifact for this platform. There
          # is nothing to patch from, and that is recoverable -- publish a
          # Full-only release -- so it must not fail the job.
          if gh release download "${{ steps.versions.outputs.previous_tag }}" \
               --pattern '*.app.tar.gz' --dir previous 2>/dev/null; then
            echo "PREVIOUS_OK=true" >> "$GITHUB_ENV"
          else
            echo "::warning::State B: ${{ steps.versions.outputs.previous_tag }} has no"
            echo "::warning::.app.tar.gz asset. Publishing without a delta layer."
            echo "PREVIOUS_OK=false" >> "$GITHUB_ENV"
          fi

      # Ungated, and that is blocker B5's fix. Every release produces a manifest;
      # only the delta arguments depend on there being a predecessor.
      - name: Generate the release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ steps.versions.outputs.version }}"
          new_installer="$(ls dist/*.app.tar.gz | head -1)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # --app-config rather than --app-id: it supplies the identifier from
          # the same file the build read, and enforces the version contract --
          # tauri.conf.json, the app crate's Cargo.toml and --target-version must
          # all name the same version. Audit finding A-2.

          args=(
            --platform "$MACOS_PLATFORM"
            --app-config examples/desktop-app/tauri.conf.json
            --target-version "$version"
            --new-installer "$new_installer"
            --installer-url "$base/$(basename "$new_installer")"
            --manifest dist/manifest.json
            --signature-out "$new_installer.sig"
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          )

          if [ "${{ steps.versions.outputs.has_previous }}" = "true" ] \
             && [ "${PREVIOUS_OK}" = "true" ]; then
            previous_version="${{ steps.versions.outputs.previous_version }}"
            previous_installer="$(ls previous/*.app.tar.gz | head -1)"
            patch="dist/${previous_version}-to-${version}.zst"
            tar_patch="dist/${previous_version}-to-${version}.tar.zst"
            echo "State C: patching from ${previous_version}"
            args+=(
              --from-version "$previous_version"
              --previous-installer "$previous_installer"
              --patch-url "$base/$(basename "$patch")"
              --patch-out "$patch"
              --tar-patch-url "$base/$(basename "$tar_patch")"
              --tar-patch-out "$tar_patch"
              # The tar layer is the entire reason this project exists on macOS.
              # A silently missing one looks like a working release in which
              # every client downloads everything.
              --require-tar-layer
            )
          else
            echo "State A or B: no predecessor. Publishing full-download only."
          fi

          ./target/release/delta-release "${args[@]}"

      # The gate. Reads the manifest back as a stranger, hashes the artifact
      # about to be uploaded, verifies the signature under the configured public
      # key, and refuses if the document does not describe this release.
      - name: Verify the manifest describes this release
        run: |
          set -euo pipefail
          # The identifier, the public key and the app's own version all come
          # from the one file the build read. Extracting two of the three with
          # python3 and never reading the third is how a tag could publish a
          # differently versioned application (audit finding A-2).
          ./target/release/release-check \
            --manifest dist/manifest.json \
            --tag "${GITHUB_REF_NAME}" \
            --app-config examples/desktop-app/tauri.conf.json \
            --platform "$MACOS_PLATFORM" \
            --artifact "$(ls dist/*.app.tar.gz | head -1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Exactly the published asset set. Nothing from the cache, the tar
          # layer's scratch directory, or the research tree.
          assets=(
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig
            dist/manifest.json
            dist/*.zst
          )

          # `gh release upload` fails if the release does not exist, and pushing
          # a tag does not create one. On the very first release there is
          # nothing to upload to -- the same state-A blindness as B5, one step
          # further along.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::creating release ${GITHUB_REF_NAME}"
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

          echo "Uploading: ${assets[*]}"
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

      # The Windows job extends this document rather than writing a second one:
      # one release, one updater manifest, one `version` field. Two documents
      # would be two answers to "what is the latest release".
      - name: Hand the manifest to the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: manifest-macos
          path: dist/manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows, folded into the same manifest.
  #
  # No tar layer: an NSIS installer is not a gzipped tarball, so the release
  # publishes an `opaque-v1` direct patch and the client's cache holds the exact
  # official installer as its base (docs/DECISIONS.md #36).
  # ---------------------------------------------------------------------------
  windows:
    name: Windows - build + sign + publish
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the release tooling
        shell: bash
        run: cargo build --release --locked -p tauri-updater-delta-release

      - name: Check the version contract before building anything
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/release-check.exe \
            --tag "${GITHUB_REF_NAME}" \
            --app-config examples/desktop-app/tauri.conf.json \
            --only-version-contract

      - name: Install the Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked

      - name: Build this version
        # The signing key is deliberately absent, exactly as on macOS: the one
        # signature this release publishes is the one `delta-release` makes,
        # with an authenticated release identity in its trusted comment.
        shell: bash
        run: |
          set -euo pipefail
          (cd examples/desktop-app && cargo tauri build)
          mkdir -p dist
          shopt -s nullglob
          bundles=(target/release/bundle/nsis/*-setup.exe)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::expected exactly one -setup.exe, found ${#bundles[@]}."
            echo "::error::The bundle layout changed and every later step would be guessing."
            exit 1
          fi
          cp "${bundles[0]}" "dist/$(basename "${bundles[0]}")"
          if [ -e "${bundles[0]}.sig" ]; then
            echo "::error::the bundler produced a signature of its own."
            echo "::error::That signature carries no authenticated release identity, and"
            echo "::error::publishing it would make every client refuse the delta paths."
            echo "::error::The signing key must not be in scope during the build step."
            exit 1
          fi
          echo "Built $(basename "${bundles[0]}")"

      - name: Take the manifest the macOS job published
        uses: actions/download-artifact@v4
        with:
          name: manifest-macos
          path: dist

      - name: Download the previous release's Windows installer
        if: needs.release.outputs.has_previous == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          # State B for this platform specifically: the previous release exists
          # but has no Windows asset, which is exactly what the release before
          # this workflow gained a Windows job looks like.
          if gh release download "${{ needs.release.outputs.previous_tag }}" \
               --pattern '*-setup.exe' --dir previous 2>/dev/null; then
            echo "PREVIOUS_OK=true" >> "$GITHUB_ENV"
          else
            echo "::warning::${{ needs.release.outputs.previous_tag }} has no"
            echo "::warning::-setup.exe asset. Publishing Windows without a delta layer."
            echo "PREVIOUS_OK=false" >> "$GITHUB_ENV"
          fi

      - name: Add this platform to the release
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          new_installer="$(ls dist/*-setup.exe | head -1)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          args=(
            --platform "$WINDOWS_PLATFORM"
            --app-config examples/desktop-app/tauri.conf.json
            --target-version "$version"
            --new-installer "$new_installer"
            --installer-url "$base/$(basename "$new_installer")"
            --manifest dist/manifest.json
            --signature-out "$new_installer.sig"
            --max-direct-patch-percent 30
          )

          if [ "${{ needs.release.outputs.has_previous }}" = "true" ] \
             && [ "${PREVIOUS_OK}" = "true" ]; then
            previous_version="${{ needs.release.outputs.previous_version }}"
            previous_installer="$(ls previous/*-setup.exe | head -1)"
            patch="dist/${previous_version}-to-${version}-windows.zst"
            echo "Patching from ${previous_version}"
            args+=(
              --from-version "$previous_version"
              --previous-installer "$previous_installer"
              --patch-url "$base/$(basename "$patch")"
              --patch-out "$patch"
            )
            # Deliberately no --require-tar-layer and no --tar-patch-*: an NSIS
            # installer has no inner tar this build can rebuild byte-for-byte,
            # so asking for one would fail the release for being correct.
          else
            echo "No usable Windows predecessor. Publishing full-download only."
          fi

          ./target/release/delta-release.exe "${args[@]}"

      - name: Verify the manifest describes this release on both platforms
        shell: bash
        run: |
          set -euo pipefail
          # Windows first, then macOS against the artifact the other job
          # published: the merge is the step that can go wrong, and a gate that
          # only checked the platform it just added would not notice the
          # document losing the other one.
          ./target/release/release-check.exe \
            --manifest dist/manifest.json \
            --tag "${GITHUB_REF_NAME}" \
            --app-config examples/desktop-app/tauri.conf.json \
            --platform "$WINDOWS_PLATFORM" \
            --artifact "$(ls dist/*-setup.exe | head -1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

          mkdir -p macos-check
          gh release download "${GITHUB_REF_NAME}" --pattern '*.app.tar.gz' --dir macos-check
          ./target/release/release-check.exe \
            --manifest dist/manifest.json \
            --tag "${GITHUB_REF_NAME}" \
            --app-config examples/desktop-app/tauri.conf.json \
            --platform "$MACOS_PLATFORM" \
            --artifact "$(ls macos-check/*.app.tar.gz | head -1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/manifest.json
            dist/*-windows.zst
          )
          echo "Uploading: ${assets[*]}"
          # --clobber replaces the macOS-only manifest with the merged one.
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

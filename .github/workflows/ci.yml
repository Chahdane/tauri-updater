name: CI

on:
  # All branches, not just main. Work happens on feature branches, and waiting
  # for a PR to exist before getting any signal means pushing blind. On a public
  # repo the runners are free, so the duplicate run a PR branch gets (once for
  # the push, once for the pull_request) is worth the earlier feedback.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    # The engine is platform-agnostic by design, so it is tested on all three
    # desktop platforms even though only Linux artifacts are supported yet.
    # Development happens on macOS, which makes the Linux and Windows runs the
    # only evidence that claim holds.
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        # --nocapture so the measured patch ratio lands in the CI log.
        run: cargo test --workspace --all-features --locked -- --nocapture

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build at the declared minimum supported Rust version
        run: cargo check --workspace --all-targets --all-features --locked

name: CI

on:
  # All branches, not just main. Work happens on feature branches, and waiting
  # for a PR to exist before getting any signal means pushing blind. On a public
  # repo the runners are free, so the duplicate run a PR branch gets (once for
  # the push, once for the pull_request) is worth the earlier feedback.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned for the same reason the release workflow pins it: the bundler inside
  # this CLI decides what an installer looks like, and a harness that measures
  # one bundler while the release ships another measures nothing.
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # tauri pulls in wry -> webkit2gtk-sys, which runs pkg-config at build
        # time. Without these the workspace no longer compiles on Linux at all.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = "\n".join(Path("clippy.log").read_text(errors="replace").splitlines()[-80:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Clippy failed::{text}")
          PY
          fi
          exit "$status"
      # Every other cargo invocation in this workflow passes --all-features, so
      # nothing compiled the configuration a consumer actually gets. That became
      # a real risk when the plugin gained ~15 `cfg(feature = "test-support")`
      # sites: production code accidentally depending on a gated item would break
      # every downstream build while CI stayed green.
      - name: Lint the default feature set consumers get
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build public documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  test:
    # The engine is platform-agnostic by design, so it is tested on all three
    # desktop platforms. The v0.1 application path is macOS; Linux and Windows
    # jobs prove engine portability and compilation, not real install support.
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # tauri pulls in wry -> webkit2gtk-sys, which runs pkg-config at build
        # time. Without these the workspace no longer compiles on Linux at all.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        # --nocapture so the measured patch ratio lands in the CI log.
        run: cargo test --workspace --all-features --locked -- --nocapture

      # The two assertions below are load-bearing, and a green job is not proof
      # they ran: a build-dependency change is exactly how a test starts being
      # skipped without anything going red. These steps fail if the assertion
      # did not execute, so the job's colour carries the claim.
      - name: Confirm the cross-platform determinism assertion actually ran
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test -p tauri-updater-delta-core --test appimage_roundtrip --locked \
                  -- --exact patch_bytes_are_identical_on_every_platform --nocapture)
          echo "$out"
          grep -q "test patch_bytes_are_identical_on_every_platform ... ok" <<< "$out" \
            || { echo "::error::determinism assertion did not run"; exit 1; }
          grep -q "1 passed; 0 failed; 0 ignored" <<< "$out" \
            || { echo "::error::determinism assertion was filtered or ignored"; exit 1; }
          # The patch bytes themselves, on this platform. Identical on all three.
          grep -q "blake3 6892d72ab49da606bbeb98c04c8110aa145038492fbf849568590b99d8d5b546" <<< "$out" \
            || { echo "::error::patch bytes differ on this platform"; exit 1; }

      # The recompression recipe is the whole basis of the tar layer, and its
      # only falsifier is a real published artifact. If this stops running, the
      # suite goes on proving that the recipe agrees with itself.
      - name: Confirm the recompression fixture assertion actually ran
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test -p tauri-updater-delta-core --test macos_recompression --locked -- --nocapture)
          echo "$out"
          grep -q "test rebuilds_a_real_published_app_tar_gz_byte_for_byte ... ok" <<< "$out" \
            || { echo "::error::the recompression fixture assertion did not run"; exit 1; }
          grep -q "test the_published_signature_accepts_the_rebuilt_artifact ... ok" <<< "$out" \
            || { echo "::error::the signature-over-rebuild assertion did not run"; exit 1; }
          grep -q "4 passed; 0 failed; 0 ignored" <<< "$out" \
            || { echo "::error::recompression tests were filtered or ignored"; exit 1; }

      # A tar-delta test suite that never reaches the tar path is exactly the
      # failure mode DECISIONS #22 records, arriving one layer down.
      - name: Confirm the tar-delta path assertion actually ran
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test -p tauri-plugin-updater-delta --features test-support \
                  --test tar_delta_flow --locked -- --nocapture)
          echo "$out"
          grep -q "test a_valid_cache_takes_the_tar_path_and_installs_the_released_bytes ... ok" <<< "$out" \
            || { echo "::error::the tar-delta happy path did not run"; exit 1; }
          grep -q "0 failed; 0 ignored" <<< "$out" \
            || { echo "::error::tar-delta tests were filtered or ignored"; exit 1; }

      # The Windows delta path, asserted the same way. It runs on every platform
      # because its artifacts are opaque blobs, so a change that breaks the
      # Windows route fails here before the expensive NSIS job even starts.
      - name: Confirm the direct-delta path assertion actually ran
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test -p tauri-plugin-updater-delta --features test-support \
                  --test direct_delta_flow --locked -- --nocapture)
          echo "$out"
          grep -q "test the_full_relaunch_direct_delta_ladder_completes ... ok" <<< "$out" \
            || { echo "::error::the Full -> relaunch -> DirectDelta ladder did not run"; exit 1; }
          grep -q "0 failed; 0 ignored" <<< "$out" \
            || { echo "::error::direct-delta tests were filtered or ignored"; exit 1; }

      - name: Confirm the forgery doctests actually ran
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test -p tauri-updater-delta-core --doc --locked)
          echo "$out"
          count=$(grep -c "compile fail ... ok" <<< "$out" || true)
          [ "$count" -eq 2 ] \
            || { echo "::error::expected 2 compile_fail doctests, saw $count"; exit 1; }

      # The claim is that the plugin's public API cannot express a fabricated
      # identity or a mismatched installer. That claim is only carried by two
      # compile_fail doctests, and a doctest that silently stops running looks
      # exactly like one that passes.
      - name: Confirm the API-boundary doctests actually ran
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test -p tauri-plugin-updater-delta --doc --locked)
          echo "$out"
          count=$(grep -c "compile fail ... ok" <<< "$out" || true)
          [ "$count" -eq 2 ] \
            || { echo "::error::expected 2 compile_fail doctests, saw $count"; exit 1; }

  # ---------------------------------------------------------------------------
  # The plugin's suite against newer tauri-plugin-updater releases.
  #
  # `range-max` resolves the newest version the declared range admits and must
  # pass: it is what a consumer's `cargo update` can pick. `latest` forces the
  # newest published release, including one outside the range. It is an early
  # warning and may fail: the range only widens after a person re-reads the six
  # upstream behaviours in crates/plugin/tests/upstream_compat.rs, which is
  # expected to fail here until then. See docs/DECISIONS.md #21 and #39.
  # ---------------------------------------------------------------------------
  upstream-updater:
    name: upstream updater / ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.target == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [range-max, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-${{ matrix.target }}
      - name: Resolve the updater version under test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = latest ]; then
            latest="$(curl -fsSL -A "tauri-updater-delta-ci" \
              https://crates.io/api/v1/crates/tauri-plugin-updater \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_stable_version"])')"
            sed -i -E "s/^tauri-plugin-updater = .*/tauri-plugin-updater = \"=${latest}\"/" \
              crates/plugin/Cargo.toml
          fi
          cargo update -p tauri-plugin-updater
          resolved="$(cargo tree -p tauri-plugin-updater-delta -i tauri-plugin-updater \
            --depth 0 --all-features | head -1)"
          echo "::notice title=Updater under test (${{ matrix.target }})::$resolved"
      - name: Test the plugin against it
        run: cargo test -p tauri-plugin-updater-delta --all-features -- --nocapture

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # tauri pulls in wry -> webkit2gtk-sys, which runs pkg-config at build
        # time. Without these the workspace no longer compiles on Linux at all.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build at the declared minimum supported Rust version
        run: cargo check --workspace --all-targets --all-features --locked

  # ---------------------------------------------------------------------------
  # The real Windows proof. Three `cargo tauri build` runs, two releases, one
  # installation moved 1.0.0 -> 1.0.1 -> 1.0.2 through the real NSIS installer
  # Tauri invokes.
  #
  # The engine-level Windows path is covered by
  # crates/plugin/tests/direct_delta_flow.rs, which runs in the matrix above on
  # every platform. That proves the mechanism. It cannot prove that a real NSIS
  # installer accepts the reconstructed bytes, that the cache survives a real
  # reinstall, or that the promotion happens on a real relaunch. Only this does.
  #
  # Expensive on purpose, and separate so a failure here reads as "the Windows
  # client regressed" rather than "something is wrong somewhere".
  # ---------------------------------------------------------------------------
  windows-e2e:
    name: windows nsis e2e
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo install` compiles the CLI from source, which on a Windows runner
      # costs more than the three application builds this job exists to perform.
      # The binary is a pure function of the pinned version, so it is cached by
      # that version rather than rebuilt every run.
      - name: Restore the pinned Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install the pinned Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked

      - name: Build three versions and publish two releases
        shell: bash
        run: ./examples/desktop-app/e2e/build-three-versions-windows.sh /c/delta-nsis-e2e

      - name: Install, update twice, and assert which path each took
        shell: bash
        run: ./examples/desktop-app/e2e/run-nsis-e2e.sh /c/delta-nsis-e2e

      - name: Publish the measurements
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # Into the log as well as the summary: the log is what a maintainer
          # can fetch and turn into a research record, and a measurement that
          # exists only in rendered HTML is a measurement nobody will cite.
          for f in /c/delta-nsis-e2e/versions.json /c/delta-nsis-e2e/e2e-report.json; do
            [ -f "$f" ] || continue
            echo "----- BEGIN $(basename "$f") -----"
            cat "$f"
            echo "----- END $(basename "$f") -----"
          done
          {
            echo "### Windows NSIS end-to-end"
            echo ""
            for f in /c/delta-nsis-e2e/versions.json /c/delta-nsis-e2e/e2e-report.json; do
              if [ -f "$f" ]; then
                echo "<details><summary>$(basename "$f")</summary>"
                echo ""
                echo '```json'
                cat "$f"
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence on a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-e2e-logs
          if-no-files-found: ignore
          path: |
            C:/delta-nsis-e2e/run/app.log
            C:/delta-nsis-e2e/run/server.log
            C:/delta-nsis-e2e/run/requests.log
            C:/delta-nsis-e2e/versions.json
            C:/delta-nsis-e2e/e2e-report.json

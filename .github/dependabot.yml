version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      cargo:
        patterns: ["*"]
    # Pinned on purpose; a bump here needs a decision, not a PR.
    # flate2, zlib-rs, libz-rs-sys and tar must match the compressor the pinned
    # tauri-cli builds with (docs/DECISIONS.md #42). tauri-plugin-updater's
    # range is widened only after its six load-bearing behaviours are re-read
    # (#21, #39).
    ignore:
      - dependency-name: "flate2"
      - dependency-name: "zlib-rs"
      - dependency-name: "libz-rs-sys"
      - dependency-name: "tar"
      - dependency-name: "tauri-plugin-updater"
      # Patch engine and release signing: upgraded one at a time, checked
      # against the pinned patch digest (F2) and Tauri's verifier (#6).
      - dependency-name: "zstd"
      - dependency-name: "minisign"
      - dependency-name: "base64"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
